<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Augury Character Sheet Styleguide</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=UnifrakturCook:wght@700&family=Oswald:wght@400;500;700&display=swap');

    :root {
      /* Base Theme (Creamy parchment / Character Sheet Style) */
      --bg-primary: #f0ebe1;
      --bg-secondary: #e2dcd0;
      --ink-primary: #181716;
      
      /* Reserved Accents */
      --accent-green-bg: #e6e8e2;
      --accent-orange-bg: #e0b48a;

      /* Font Stack */
      --font-heading: 'UnifrakturCook', cursive; /* Ornate, display */
      --font-body: 'EB Garamond', serif; /* Classic, highly legible */
      --font-label: 'Oswald', sans-serif; /* Clean, bold, structured */
    }

    body {
      background-color: #d1cbc1;
      color: var(--ink-primary);
      font-family: var(--font-body);
      line-height: 1.4;
      margin: 0;
      padding: 3rem 1rem;
      font-size: 1.15rem;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }

    /* Page Container */
    .page-container {
      max-width: 850px;
      margin: 0 auto;
      border: 2px solid var(--ink-primary);
      padding: 3rem;
      position: relative;
      background-color: var(--bg-primary);
      /* Hand-drawn framing */
      border-radius: 2px 255px 3px 25px / 255px 5px 225px 3px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
      box-shadow: inset 0 0 60px rgba(24, 23, 22, 0.05), 5px 5px 15px rgba(0,0,0,0.1);
      filter: url('#print-texture');
    }

    /* Inner border */
    .page-container::before {
      content: '';
      position: absolute;
      top: 8px; left: 8px; right: 8px; bottom: 8px;
      border: 1px solid var(--ink-primary);
      border-radius: 255px 5px 225px 3px / 2px 255px 3px 25px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Typography */
    h1, h2, h3, h4 {
      color: var(--ink-primary);
      margin-top: 0;
      font-weight: normal;
      text-shadow: 0px 0px 1px rgba(24, 23, 22, 0.2); /* Subtle ink bleed */
    }

    /* Primary Heading (Blackletter) */
    h1 {
      font-family: var(--font-heading);
      font-size: 5rem;
      text-align: center;
      margin-bottom: 0;
      line-height: 1;
    }

    /* Secondary Heading (Clean Sans-Serif for structured blocks) */
    h2 {
      font-family: var(--font-label);
      font-size: 2rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 1.5rem;
      line-height: 1.1;
      border-bottom: 2px solid var(--ink-primary);
      padding-bottom: 0.2rem;
      display: block;
    }

    /* Tertiary Heading (Blackletter accent) */
    h3 {
      font-family: var(--font-heading);
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    /* Layout Grid */
    .sheet-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 3rem;
      margin-top: 2rem;
    }

    @media (max-width: 650px) {
      .sheet-grid { grid-template-columns: 1fr; }
    }

    /* Form Fields - Underline Style (For short inputs like Name, Class) */
    .inline-field {
      display: flex;
      align-items: flex-end;
      margin-bottom: 1.5rem;
    }
    
    .inline-field label {
      font-family: var(--font-label);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 1.1rem;
      margin-right: 0.8rem;
      line-height: 1.2;
    }
    
    .underline-input {
      flex: 1;
      border: none;
      border-bottom: 2px solid var(--ink-primary);
      background: transparent;
      font-family: var(--font-body);
      font-size: 1.4rem;
      color: var(--ink-primary);
      padding: 0 0.5rem;
      border-radius: 0; /* Reset */
    }
    
    .underline-input:focus {
      outline: none;
      background-color: rgba(0,0,0,0.03);
    }

    /* Form Fields - Box Style (For Info/Notes areas) */
    .box-field {
      border: 2px solid var(--ink-primary);
      padding: 1.2rem;
      margin-bottom: 2rem;
      position: relative;
      border-radius: 4px 8px 3px 6px / 6px 3px 8px 4px; /* Subtle hand-drawn border */
      background: transparent;
    }
    
    .box-field label {
      position: absolute;
      top: -0.9rem;
      left: 1rem;
      background-color: var(--bg-primary);
      padding: 0 0.5rem;
      font-family: var(--font-label);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .box-field textarea, .box-field input {
      width: 100%;
      border: none;
      background: transparent;
      font-family: var(--font-body);
      font-size: 1.2rem;
      color: var(--ink-primary);
      resize: vertical;
      outline: none;
    }

    /* Tickboxes (Checkboxes / Radios) */
    .tickbox-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-bottom: 2rem;
    }
    
    .tickbox-label {
      font-family: var(--font-body);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .tickbox-input {
      appearance: none;
      -webkit-appearance: none;
      width: 1.8rem;
      height: 1.8rem;
      border: 2px solid var(--ink-primary);
      background-color: transparent;
      cursor: pointer;
      position: relative;
      /* Slightly irregular square */
      border-radius: 3px 255px 5px 25px / 255px 5px 225px 3px;
    }

    .tickbox-input[type="radio"] {
      border-radius: 50% 45% 55% 50% / 45% 55% 45% 50%; /* Irregular circle */
    }
    
    .tickbox-input:checked::after {
      content: '✘'; /* Distinct handwritten-style X */
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      color: var(--ink-primary);
      font-family: sans-serif;
    }

    .tickbox-input[type="radio"]:checked::after {
      content: '●'; /* Circle fill */
      font-size: 1.2rem;
    }
    
    /* Stat blocks */
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 2rem;
    }
    
    .stat-circle {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    .stat-circle-val {
      width: 4rem;
      height: 4rem;
      border: 2px solid var(--ink-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-heading);
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      /* irregular circle */
      border-radius: 55% 45% 50% 50% / 50% 55% 45% 50%;
      background-color: transparent;
    }
    
    .stat-circle label {
      font-family: var(--font-label);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 1rem;
      letter-spacing: 1px;
    }
    
    .btn {
      display: inline-block;
      width: 100%;
      padding: 1.2rem;
      background-color: var(--ink-primary);
      color: var(--bg-primary);
      border: 2px solid var(--ink-primary);
      font-family: var(--font-label);
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 700;
      font-size: 1.4rem;
      cursor: pointer;
      text-align: center;
      border-radius: 255px 5px 225px 3px / 2px 255px 3px 25px;
      transition: background-color 0.2s, color 0.2s;
    }

    .btn:hover {
      background-color: var(--bg-secondary);
      color: var(--ink-primary);
    }
  </style>
</head>
<body>
  <!-- SVG Filters -->
  <svg width="0" height="0" style="position: absolute; z-index: -1;">
    <filter id="print-texture" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.0" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <div class="page-container">
    <header style="margin-bottom: 2.5rem;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 1.5rem; margin-bottom: 0.5rem;">
        <img src="logo.png" alt="Augury Logo" style="height: 5rem; mix-blend-mode: multiply;" onerror="this.style.display='none'" />
        <h1 style="margin-bottom: 0;">Augury</h1>
      </div>
      <div style="text-align: center; font-family: var(--font-label); text-transform: uppercase; letter-spacing: 4px; opacity: 0.8;">Character Ledger</div>
    </header>

    <main>
      <div class="sheet-grid">
        <!-- Left Column: Details -->
        <div class="column">
          <h2>Identity</h2>
          
          <div class="inline-field">
            <label>Name</label>
            <input type="text" class="underline-input" placeholder="Silas the Unyielding" />
          </div>
          
          <div class="inline-field">
            <label>Class</label>
            <input type="text" class="underline-input" placeholder="The Worker" />
          </div>
          
          <div class="box-field" style="margin-top: 3rem;">
            <label>Background & Info</label>
            <textarea rows="4" placeholder="Write your grim history here..."></textarea>
          </div>
          
          <h2 style="margin-top: 3rem;">Inventory</h2>
          <div class="tickbox-group">
            <label class="tickbox-label">
              <input type="checkbox" class="tickbox-input"> Lantern (lit)
            </label>
            <label class="tickbox-label">
              <input type="checkbox" class="tickbox-input" checked> Rope (50ft)
            </label>
            <label class="tickbox-label">
              <input type="checkbox" class="tickbox-input"> Iron Rations
            </label>
          </div>
        </div>

        <!-- Right Column: Stats & Status -->
        <div class="column">
          <h2>Attributes</h2>
          
          <div class="stat-row">
            <div class="stat-circle">
              <div class="stat-circle-val">12</div>
              <label>Might</label>
            </div>
            <div class="stat-circle">
              <div class="stat-circle-val">8</div>
              <label>Grace</label>
            </div>
            <div class="stat-circle">
              <div class="stat-circle-val">14</div>
              <label>Will</label>
            </div>
          </div>
          
          <h2 style="margin-top: 3rem;">Condition</h2>
          
          <div class="box-field">
            <label>Current Health</label>
            <input type="text" style="font-family: var(--font-heading); font-size: 3rem; text-align: center;" value="10 / 10" />
          </div>
          
          <div class="tickbox-group">
            <label class="tickbox-label">
              <input type="radio" name="status" class="tickbox-input" checked> Healthy & Hale
            </label>
            <label class="tickbox-label">
              <input type="radio" name="status" class="tickbox-input"> Severely Wounded
            </label>
            <label class="tickbox-label">
              <input type="radio" name="status" class="tickbox-input"> Doomed
            </label>
          </div>
          
        </div>
      </div>
      
      <div style="margin-top: 4rem;">
        <button class="btn">Commit to the Ledger</button>
      </div>
    </main>
  </div>
</body>
</html>
